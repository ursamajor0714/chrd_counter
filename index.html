<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101214">
<title>CHAD 1000X 카운터</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101214;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}main{width:min(100%,430px);text-align:center}h1{font-size:20px;letter-spacing:2px;margin:0 0 24px}#count{font-size:76px;font-weight:800;letter-spacing:-4px;font-variant-numeric:tabular-nums}.sub{color:#9ba3aa;margin:4px 0 20px}.track{height:10px;background:#30363b;border-radius:20px;overflow:hidden;margin:20px 0 28px}#bar{height:100%;width:0;background:#42d392;transition:width .15s}.stats{display:flex;justify-content:space-between;color:#b7bec4;font-size:14px;margin-bottom:24px}button{border:0;border-radius:14px;padding:14px 10px;font-size:15px;font-weight:700;color:#101214;background:#42d392;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.98)}button:focus-visible{outline:3px solid white;outline-offset:3px}.primary{width:100%;margin-bottom:12px;padding:17px 14px;font-size:17px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.controls button{background:#2a3035;color:#fff}#status{min-height:42px;color:#aab2b8;font-size:13px;line-height:1.5;margin:14px 0}.note{font-size:12px;color:#818a91;line-height:1.5;margin-top:24px}#debug{min-height:18px;color:#9ba3aa;font-size:11px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
  <h1>CHAD 1000X</h1>
  <div id="count" aria-live="polite">0</div>
  <div class="sub"> / 1,000 reps</div>
  <div class="track" role="progressbar" aria-label="진행률" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="0"><div id="bar"></div></div>
  <div class="stats"><span id="pct">0%</span><span id="timer">00:00</span></div>
  <button class="primary" id="start" type="button">센서 켜고 시작</button>
  <div class="controls">
    <button id="minus100" type="button">− 100</button><button id="minus10" type="button">− 10</button><button id="plus10" type="button">+ 10</button><button id="plus100" type="button">+ 100</button>
  </div>
  <div class="controls">
    <button id="minus1" type="button">− 1</button><button id="plus1" type="button">+ 1</button><button id="pause" type="button">일시정지</button><button id="reset" type="button">처음부터</button>
  </div>
  <div id="status" role="status" aria-live="polite">iPhone Safari에서 열고 시작 버튼을 눌러 센서 권한을 허용해.</div>
  <div id="debug">센서 신호: 대기 중</div>
  <div class="note">Made by UrsaMajor </div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let count=0, running=false, startedAt=0, elapsed=0, timerId=null;
  let smooth=0, above=false, peak=0;
  let firstSignalTime=null, lastSignalTime=0, lastCountTime=0;
  let sensorEvents=0;
  const THRESHOLD=2.40;          // 큰 동작만 감지: 높이면 작은 흔들림을 더 많이 무시
  const MIN_SIGNAL_GAP=350;      // 한 번의 흔들림에서 중복 신호 억제
  const MAX_PAIR_GAP=3000;       // 상승/하강 신호가 짝을 이룰 수 있는 최대 간격
  const COUNT_LOCKOUT=1300;      // 한 사이클의 잔여 흔들림으로 재카운트하지 않게 함

  function render(){
    $('count').textContent=count.toLocaleString('en-US');
    const pct=Math.min(100,count/10);
    $('bar').style.width=pct+'%'; $('pct').textContent=pct+'%';
    document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(count));
  }
  function updateTimer(){
    const ms=elapsed+(running?Date.now()-startedAt:0), sec=Math.floor(ms/1000);
    $('timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  }
  function say(text){
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=1.05;speechSynthesis.speak(u);
  }
  function increment(){
    if(!running||count>=1000)return;
    count++;render();
    if(count%100===0){say(count+'회 완료');$('status').textContent=count+'회 완료!';}
    if(count===1000){pause();say('천 회 완료! 차드 끝!');$('status').textContent='1,000회 완료!';}
  }
  function registerSignal(now){
    if(now-lastSignalTime<MIN_SIGNAL_GAP)return;
    lastSignalTime=now;
    sensorEvents++;
    $('debug').textContent='가속도 신호 감지 '+sensorEvents+'회 · 피크 '+peak.toFixed(2);
    if(now-lastCountTime<COUNT_LOCKOUT)return;
    if(firstSignalTime===null||now-firstSignalTime>MAX_PAIR_GAP){
      firstSignalTime=now;
      $('status').textContent='첫 움직임 신호 감지 · 다음 신호 대기';
      return;
    }
    firstSignalTime=null;
    lastCountTime=now;
    increment();
    if(running)$('status').textContent='1회 기록 · 센서 감지 중';
  }
  function onMotion(e){
    if(!running)return;
    const a=e.accelerationIncludingGravity;
    if(!a||!Number.isFinite(a.x)||!Number.isFinite(a.y)||!Number.isFinite(a.z)){
      $('debug').textContent='센서 이벤트는 왔지만 가속도값이 비어 있음';return;
    }
    // 초기 코드와 동일: 중력 포함 3축 가속도 크기에서 완만한 기준값을 빼 움직임을 검출
    const mag=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);
    smooth=smooth*.82+mag*.18;
    const dynamic=Math.abs(mag-smooth);
    $('debug').textContent='가속도 편차 '+dynamic.toFixed(2)+' / 기준 '+THRESHOLD.toFixed(2);
    if(dynamic>THRESHOLD){
      if(!above){above=true;peak=dynamic;}else peak=Math.max(peak,dynamic);
    }else if(above){
      above=false;
      if(peak>THRESHOLD)registerSignal(Date.now());
      peak=0;
    }
  }
  async function start(){
    if(running||count>=1000)return;
    try{
      if(!window.isSecureContext){$('status').textContent='센서에는 HTTPS가 필요해. GitHub Pages의 https:// 주소로 열어줘.';return;}
      if(typeof DeviceMotionEvent==='undefined'){$('status').textContent='이 브라우저에서 동작 센서를 지원하지 않아. iPhone Safari에서 열어줘.';return;}
      if(typeof DeviceMotionEvent.requestPermission==='function'){
        const permission=await DeviceMotionEvent.requestPermission();
        if(permission!=='granted'){$('status').textContent='동작 센서 권한이 허용되지 않았어. Safari 권한 설정을 확인해줘.';return;}
      }
      smooth=0;above=false;peak=0;firstSignalTime=null;lastSignalTime=0;lastCountTime=0;sensorEvents=0;
      window.removeEventListener('devicemotion',onMotion);
      window.addEventListener('devicemotion',onMotion,{passive:true});
      running=true;startedAt=Date.now();
      $('start').textContent='운동 중 · 센서 작동';$('status').textContent='센서 감지 중. 아래 가속도 편차 숫자가 움직일 때 변하는지 확인해줘.';$('debug').textContent='가속도 신호 대기 중';
      if(timerId!==null)clearInterval(timerId);
      timerId=setInterval(updateTimer,500);say('차드 카운터 시작');
    }catch(err){$('status').textContent='센서 시작 실패: '+(err&&err.message?err.message:'권한 확인 필요');}
  }
  function pause(message='일시정지 상태야.'){
    if(running){elapsed+=Date.now()-startedAt;running=false;}
    window.removeEventListener('devicemotion',onMotion);
    if(timerId!==null){clearInterval(timerId);timerId=null;}
    $('start').textContent=count>=1000?'완료':'다시 시작';
    if(count<1000)$('status').textContent=message;
    updateTimer();
  }
  $('start').addEventListener('click',start);
  $('pause').addEventListener('click',()=>pause());
  $('plus1').addEventListener('click',()=>{if(count<1000){count++;render();}});
  $('minus1').addEventListener('click',()=>{count=Math.max(0,count-1);render();});
  $('plus10').addEventListener('click',()=>{count=Math.min(1000,count+10);render();});
  $('minus10').addEventListener('click',()=>{count=Math.max(0,count-10);render();});
  $('plus100').addEventListener('click',()=>{count=Math.min(1000,count+100);render();});
  $('minus100').addEventListener('click',()=>{count=Math.max(0,count-100);render();});
  $('reset').addEventListener('click',()=>{
    if(!confirm('횟수와 시간을 모두 초기화할까?'))return;
    pause();count=0;elapsed=0;smooth=0;above=false;peak=0;firstSignalTime=null;lastSignalTime=0;lastCountTime=0;sensorEvents=0;render();updateTimer();
    $('start').textContent='센서 켜고 시작';$('status').textContent='초기화 완료.';$('debug').textContent='센서 신호: 대기 중';
  });
  render();updateTimer();
})();
</script>
</body>
</html>
