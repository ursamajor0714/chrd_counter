
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101214">
<title>CHAD 1000X 카운터</title>

<style>
:root { color-scheme: dark; }

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101214;
  color: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

main {
  width: min(100%, 430px);
  text-align: center;
}

h1 {
  font-size: 20px;
  letter-spacing: 2px;
  margin: 0 0 24px;
}

#count {
  font-size: 76px;
  font-weight: 800;
  letter-spacing: -4px;
  font-variant-numeric: tabular-nums;
}

.sub {
  color: #9ba3aa;
  margin: 4px 0 20px;
}

.track {
  height: 10px;
  background: #30363b;
  border-radius: 20px;
  overflow: hidden;
  margin: 20px 0 28px;
}

#bar {
  height: 100%;
  width: 0;
  background: #42d392;
  transition: width .15s;
}

.stats {
  display: flex;
  justify-content: space-between;
  color: #b7bec4;
  font-size: 14px;
  margin-bottom: 24px;
}

button {
  border: 0;
  border-radius: 14px;
  padding: 14px 10px;
  font-size: 15px;
  font-weight: 700;
  color: #101214;
  background: #42d392;
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  transform: scale(.98);
}

.primary {
  width: 100%;
  margin-bottom: 12px;
  padding: 17px 14px;
  font-size: 17px;
}

.controls {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 10px;
}

.controls button {
  background: #2a3035;
  color: #fff;
}

#status {
  min-height: 42px;
  color: #aab2b8;
  font-size: 13px;
  line-height: 1.5;
  margin: 14px 0;
}

.note {
  font-size: 12px;
  color: #818a91;
  line-height: 1.5;
  margin-top: 24px;
}

</style>
</head>

<body>

<main>

  <h1>CHAD 1000X</h1>

  <div id="count">0</div>
  <div class="sub"> / 1,000 reps</div>

  <div class="track">
    <div id="bar"></div>
  </div>

  <div class="stats">
    <span id="pct">0%</span>
    <span id="timer">00:00</span>
  </div>

  <button class="primary" id="start">
    센서 켜고 시작
  </button>

  <div class="controls">
    <button id="minus100">− 100</button>
    <button id="minus10">− 10</button>
    <button id="plus10">+ 10</button>
    <button id="plus100">+ 100</button>
  </div>

  <div class="controls">
    <button id="minus1">− 1</button>
    <button id="plus1">+ 1</button>
    <button id="pause">일시정지</button>
    <button id="reset">처음부터</button>
  </div>

  <div id="status">
    휴대폰을 바지 주머니에 넣고 시작 버튼을 눌러 센서 권한을 허용해.
  </div>

  <div class="note">
    스텝업 전용 센서 판정 방식.
    상승과 하강 움직임을 하나의 운동 사이클로 계산합니다.
    화면 잠금 방지를 지원하는 브라우저에서는 화면을 유지합니다.
  </div>

</main>

<script>
(() => {

  const $ = id => document.getElementById(id);

  let count = 0;
  let running = false;
  let startedAt = 0;
  let elapsed = 0;
  let timerId = null;
  let wakeLock = null;

  // 센서 필터
  let gravity = { x: 0, y: 0, z: 0 };
  let gravityInitialized = false;
  let smoothEnergy = 0;
  let lastSensorTime = 0;

  // 동작 구간
  let inMotion = false;
  let motionPeak = 0;
  let motionStart = 0;
  let belowSince = 0;
  let lastEventTime = 0;
  let firstEventTime = 0;

  // 감도 설정
  const START_THRESHOLD = 1.0;
  const END_THRESHOLD = 0.45;
  const MIN_PEAK = 1.15;

  const MIN_EVENT_GAP = 300;
  const MAX_CYCLE_GAP = 3000;
  const END_HOLD = 160;

  function render() {
    $('count').textContent = count.toLocaleString('en-US');

    const pct = Math.min(100, count / 10);

    $('bar').style.width = pct + '%';
    $('pct').textContent = pct + '%';
  }

  function updateTimer() {
    const ms = elapsed + (
      running ? Date.now() - startedAt : 0
    );

    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);

    $('timer').textContent =
      String(m).padStart(2, '0') + ':' +
      String(s % 60).padStart(2, '0');
  }

  function say(text) {
    if (!('speechSynthesis' in window)) return;

    speechSynthesis.cancel();

    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = 1.05;

    speechSynthesis.speak(u);
  }

  function increment(val = 1) {
    count = Math.min(1000, Math.max(0, count + val));

    render();

    if (
      running &&
      count > 0 &&
      count % 100 === 0
    ) {
      say(count + '회 완료');
      $('status').textContent = count + '회 완료!';
    }

    if (count === 1000 && running) {
      pause();
      say('천 회 완료! 차드 끝!');
      $('status').textContent = '1,000회 완료!';
    }
  }

  function resetDetector() {
    gravity = { x: 0, y: 0, z: 0 };
    gravityInitialized = false;
    smoothEnergy = 0;
    lastSensorTime = 0;

    inMotion = false;
    motionPeak = 0;
    motionStart = 0;
    belowSince = 0;
    lastEventTime = 0;
    firstEventTime = 0;
  }

  function registerEvent(now, peak) {
    if (peak < MIN_PEAK) return;

    if (now - lastEventTime < MIN_EVENT_GAP) return;

    lastEventTime = now;

    if (firstEventTime === 0) {
      firstEventTime = now;

      $('status').textContent =
        '첫 번째 동작 감지 · 다음 동작 대기';

      return;
    }

    const gap = now - firstEventTime;

    if (gap <= MAX_CYCLE_GAP) {
      firstEventTime = 0;

      increment(1);

      if (running) {
        $('status').textContent =
          '스텝업 1회 완료 · 센서 감지 중';
      }

    } else {
      firstEventTime = now;

      $('status').textContent =
        '새로운 동작 사이클 감지 중';
    }
  }

  function onMotion(e) {
    if (!running) return;

    const a = e.acceleration;
    const ag = e.accelerationIncludingGravity;

    let x, y, z;

    // 중력 제거 데이터 우선
    if (
      a &&
      a.x !== null &&
      a.y !== null &&
      a.z !== null
    ) {
      x = a.x;
      y = a.y;
      z = a.z;

    } else if (
      ag &&
      ag.x !== null &&
      ag.y !== null &&
      ag.z !== null
    ) {

      const now = Date.now();

      if (!gravityInitialized) {
        gravity = {
          x: ag.x,
          y: ag.y,
          z: ag.z
        };

        gravityInitialized = true;
        lastSensorTime = now;

        return;
      }

      const dt = Math.min(
        0.1,
        Math.max(0.001, (now - lastSensorTime) / 1000)
      );

      const alpha = Math.exp(-dt / 0.8);

      gravity.x = alpha * gravity.x + (1 - alpha) * ag.x;
      gravity.y = alpha * gravity.y + (1 - alpha) * ag.y;
      gravity.z = alpha * gravity.z + (1 - alpha) * ag.z;

      x = ag.x - gravity.x;
      y = ag.y - gravity.y;
      z = ag.z - gravity.z;

      lastSensorTime = now;

    } else {
      return;
    }

    const now = Date.now();

    const magnitude = Math.sqrt(
      x * x + y * y + z * z
    );

    smoothEnergy =
      smoothEnergy * 0.65 + magnitude * 0.35;

    // 움직임 시작
    if (!inMotion) {
      if (smoothEnergy >= START_THRESHOLD) {
        inMotion = true;
        motionStart = now;
        motionPeak = smoothEnergy;
        belowSince = 0;
      }

      return;
    }

    motionPeak = Math.max(
      motionPeak,
      smoothEnergy
    );

    // 움직임 종료
    if (smoothEnergy < END_THRESHOLD) {

      if (belowSince === 0) {
        belowSince = now;
      }

      if (now - belowSince >= END_HOLD) {

        const duration = now - motionStart;

        inMotion = false;

        if (duration >= 100 && duration <= 1500) {
          registerEvent(now, motionPeak);
        }

        motionPeak = 0;
        belowSince = 0;
      }

    } else {
      belowSince = 0;
    }
  }

  async function start() {
    if (running) return;

    try {

      if (typeof DeviceMotionEvent === 'undefined') {
        $('status').textContent =
          '이 브라우저는 동작 센서를 지원하지 않아.';

        return;
      }

      if (
        typeof DeviceMotionEvent.requestPermission === 'function'
      ) {
        const permission =
          await DeviceMotionEvent.requestPermission();

        if (permission !== 'granted') {
          $('status').textContent =
            '센서 권한이 거부되었어.';

          return;
        }
      }

      resetDetector();

      window.removeEventListener('devicemotion', onMotion);
      window.addEventListener('devicemotion', onMotion);

      running = true;
      startedAt = Date.now();

      $('start').textContent = '운동 중 · 센서 감지 활성';
      $('status').textContent =
        '센서 활성화 완료 · 스텝업 시작!';

      clearInterval(timerId);
      timerId = setInterval(updateTimer, 500);

      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (e) {
          wakeLock = null;
        }
      }

      if (running) {
        say('차드 카운터 시작');
      }

    } catch (err) {
      running = false;

      window.removeEventListener('devicemotion', onMotion);

      $('status').textContent =
        '센서 시작 실패: ' + err.message;
    }
  }

  function pause() {
    if (running) {
      elapsed += Date.now() - startedAt;
      running = false;
    }

    window.removeEventListener('devicemotion', onMotion);

    clearInterval(timerId);
    timerId = null;

    resetDetector();

    if (wakeLock) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }

    $('start').textContent = '다시 시작';

    if (count < 1000) {
      $('status').textContent = '일시정지 상태야.';
    }

    updateTimer();
  }

  document.addEventListener('visibilitychange', async () => {
    if (
      document.visibilityState === 'visible' &&
      running &&
      'wakeLock' in navigator
    ) {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
      } catch (e) {}
    }
  });

  // 버튼 이벤트
  $('start').addEventListener('click', start);

  $('plus1').addEventListener('click', () => increment(1));
  $('minus1').addEventListener('click', () => increment(-1));

  $('plus10').addEventListener('click', () => increment(10));
  $('minus10').addEventListener('click', () => increment(-10));

  $('plus100').addEventListener('click', () => increment(100));
  $('minus100').addEventListener('click', () => increment(-100));

  $('pause').addEventListener('click', pause);

  $('reset').addEventListener('click', () => {
    if (!confirm('횟수와 시간을 모두 초기화할까?')) return;

    pause();

    count = 0;
    elapsed = 0;

    render();
    updateTimer();

    $('start').textContent = '센서 켜고 시작';
    $('status').textContent = '초기화 완료.';
  });

  render();
  updateTimer();

})();
</script>

</body>
</html>
