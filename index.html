
<script>
(() => {
  const $ = id => document.getElementById(id);

  let count = 0;
  let running = false;
  let startedAt = 0;
  let elapsed = 0;
  let timerId = null;
  let lastSpeech = 0;
  let wakeLock = null;

  // 센서 필터
  let gravity = { x: 0, y: 0, z: 0 };
  let gravityInitialized = false;
  let smoothEnergy = 0;
  let lastSensorTime = 0;

  // 동작 구간 판정
  let inMotion = false;
  let motionPeak = 0;
  let motionStart = 0;
  let belowThresholdSince = 0;
  let lastEventTime = 0;

  // 상승 / 하강 이벤트 기록
  let firstEventTime = 0;

  // 센서 튜닝값 (m/s²)
  const START_THRESHOLD = 1.0;
  const END_THRESHOLD = 0.45;
  const MIN_PEAK = 1.15;

  // 시간 설정
  const MIN_EVENT_GAP = 300;
  const MAX_CYCLE_GAP = 3000;
  const END_HOLD = 160;

  function render() {
    $('count').textContent = count.toLocaleString('en-US');

    const pct = Math.min(100, count / 10);

    $('bar').style.width = pct + '%';
    $('pct').textContent = pct + '%';
  }

  function timeText(ms) {
    let s = Math.floor(ms / 1000);
    let m = Math.floor(s / 60);
    s %= 60;

    return String(m).padStart(2, '0') +
      ':' + String(s).padStart(2, '0');
  }

  function updateTimer() {
    $('timer').textContent = timeText(
      elapsed + (running ? Date.now() - startedAt : 0)
    );
  }

  function say(text) {
    if (!('speechSynthesis' in window)) return;

    speechSynthesis.cancel();

    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = 1.05;

    speechSynthesis.speak(u);
  }

  function increment(val = 1) {
    count = Math.min(1000, Math.max(0, count + val));

    render();

    if (
      running &&
      count > 0 &&
      count % 100 === 0
    ) {
      say(count + '회 완료');
      $('status').textContent = count + '회 완료!';
    }

    if (count === 1000 && running) {
      pause();
      say('천 회 완료! 차드 끝!');
      $('status').textContent = '1,000회 완료!';
    }
  }

  // 센서 판정 상태 초기화
  function resetDetector() {
    gravity = { x: 0, y: 0, z: 0 };
    gravityInitialized = false;
    smoothEnergy = 0;
    lastSensorTime = 0;

    inMotion = false;
    motionPeak = 0;
    motionStart = 0;
    belowThresholdSince = 0;
    lastEventTime = 0;

    firstEventTime = 0;
  }

  // 한 번의 움직임 구간이 완성됐을 때 호출
  function registerEvent(now, peak) {
    if (peak < MIN_PEAK) return;

    if (now - lastEventTime < MIN_EVENT_GAP) return;

    lastEventTime = now;

    // 첫 번째 움직임 = 올라가기 또는 내려가기
    if (firstEventTime === 0) {
      firstEventTime = now;

      $('status').textContent =
        '첫 번째 동작 감지 · 다음 동작을 기다리는 중';

      return;
    }

    const gap = now - firstEventTime;

    // 일정 시간 내 두 번째 움직임이 발생하면 1회 완성
    if (gap <= MAX_CYCLE_GAP) {
      firstEventTime = 0;

      increment(1);

      if (running) {
        $('status').textContent =
          '스텝업 1회 완료 · 센서 감지 중';
      }
    } else {
      // 너무 늦게 발생한 동작은 새로운 사이클의 시작
      firstEventTime = now;

      $('status').textContent =
        '새로운 동작 사이클 감지 중';
    }
  }

  function onMotion(e) {
    if (!running) return;

    const a = e.acceleration;
    const ag = e.accelerationIncludingGravity;

    let x, y, z;

    // 중력 제거된 가속도 데이터 우선 사용
    if (
      a &&
      a.x !== null &&
      a.y !== null &&
      a.z !== null
    ) {
      x = a.x;
      y = a.y;
      z = a.z;

    } else if (
      ag &&
      ag.x !== null &&
      ag.y !== null &&
      ag.z !== null
    ) {
      // 중력 포함 데이터만 있을 경우 저역통과 필터로 중력 추정
      const now = Date.now();

      if (!gravityInitialized) {
        gravity = {
          x: ag.x,
          y: ag.y,
          z: ag.z
        };

        gravityInitialized = true;
        lastSensorTime = now;
        return;
      }

      const dt = Math.min(
        0.1,
        Math.max(0.001, (now - lastSensorTime) / 1000)
      );

      const alpha = Math.exp(-dt / 0.8);

      gravity.x = alpha * gravity.x + (1 - alpha) * ag.x;
      gravity.y = alpha * gravity.y + (1 - alpha) * ag.y;
      gravity.z = alpha * gravity.z + (1 - alpha) * ag.z;

      x = ag.x - gravity.x;
      y = ag.y - gravity.y;
      z = ag.z - gravity.z;

      lastSensorTime = now;

    } else {
      return;
    }

    const now = Date.now();

    // 3축 가속도 크기
    const magnitude = Math.sqrt(
      x * x + y * y + z * z
    );

    // 센서 노이즈 완화
    smoothEnergy =
      smoothEnergy * 0.65 + magnitude * 0.35;

    // 동작 구간 시작
    if (!inMotion) {
      if (smoothEnergy >= START_THRESHOLD) {
        inMotion = true;
        motionStart = now;
        motionPeak = smoothEnergy;
        belowThresholdSince = 0;
      }

      return;
    }

    // 동작 중 최고 에너지 기록
    motionPeak = Math.max(
      motionPeak,
      smoothEnergy
    );

    // 동작이 끝나는 구간 확인
    if (smoothEnergy < END_THRESHOLD) {
      if (belowThresholdSince === 0) {
        belowThresholdSince = now;
      }

      // 일정 시간 이상 움직임이 약해지면 동작 종료
      if (now - belowThresholdSince >= END_HOLD) {
        const duration = now - motionStart;

        inMotion = false;

        if (duration >= 100 && duration <= 1500) {
          registerEvent(now, motionPeak);
        }

        motionPeak = 0;
        belowThresholdSince = 0;
      }

    } else {
      belowThresholdSince = 0;
    }
  }

  async function start() {
    if (running) return;

    try {
      if (typeof DeviceMotionEvent === 'undefined') {
        $('status').textContent =
          '이 브라우저는 동작 센서를 지원하지 않아.';

        return;
      }

      // iOS 센서 권한 요청
      if (
        typeof DeviceMotionEvent.requestPermission === 'function'
      ) {
        const permission =
          await DeviceMotionEvent.requestPermission();

        if (permission !== 'granted') {
          $('status').textContent =
            '센서 권한이 거부되었어.';

          return;
        }
      }

      resetDetector();

      window.removeEventListener('devicemotion', onMotion);
      window.addEventListener('devicemotion', onMotion);

      running = true;
      startedAt = Date.now();

      $('start').textContent = '운동 중 · 센서 감지 활성';
      $('status').textContent =
        '센서 활성화 완료 · 스텝업을 시작해!';

      clearInterval(timerId);
      timerId = setInterval(updateTimer, 500);

      // 지원하는 브라우저에서는 화면 잠금 방지
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {
          wakeLock = null;
        }
      }

      // 권한 요청 중 일시정지 등 상태가 바뀌었는지 확인
      if (!running) return;

      say('차드 카운터 시작');

    } catch (err) {
      running = false;

      window.removeEventListener('devicemotion', onMotion);

      $('status').textContent =
        '센서 시작 실패: ' + err.message;
    }
  }

  async function releaseWakeLock() {
    if (wakeLock) {
      try {
        await wakeLock.release();
      } catch (e) {}

      wakeLock = null;
    }
  }

  function pause() {
    if (running) {
      elapsed += Date.now() - startedAt;
      running = false;
    }

    window.removeEventListener('devicemotion', onMotion);

    clearInterval(timerId);
    timerId = null;

    resetDetector();
    releaseWakeLock();

    $('start').textContent = '다시 시작';

    if (count < 1000) {
      $('status').textContent = '일시정지 상태야.';
    }

    updateTimer();
  }

  // 화면이 다시 켜졌을 때 Wake Lock 재요청
  document.addEventListener('visibilitychange', async () => {
    if (
      document.visibilityState === 'visible' &&
      running &&
      'wakeLock' in navigator
    ) {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
      } catch (e) {}
    }
  });

  $('start').addEventListener('click', start);

  $('plus1').addEventListener('click', () => increment(1));
  $('minus1').addEventListener('click', () => increment(-1));

  $('plus10').addEventListener('click', () => increment(10));
  $('minus10').addEventListener('click', () => increment(-10));

  $('plus100').addEventListener('click', () => increment(100));
  $('minus100').addEventListener('click', () => increment(-100));

  $('pause').addEventListener('click', pause);

  $('reset').addEventListener('click', () => {
    if (!confirm('횟수와 시간을 모두 초기화할까?')) {
      return;
    }

    pause();

    count = 0;
    elapsed = 0;
    lastSpeech = 0;

    render();
    updateTimer();

    $('start').textContent = '센서 켜고 시작';
    $('status').textContent = '초기화 완료.';
  });

  render();
  updateTimer();
})();
</script>
